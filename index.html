<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
    <title>FlapUp! - 🍳 Flappy Emoji Game</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #70c5ce;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
            touch-action: manipulation;
        }
        #game-container {
            position: relative;
            width: 360px;
            height: 640px;
            background: linear-gradient(to bottom, #4ec0ca 0%, #70c5ce 70%, #ded895 70%, #e0d995 100%);
            border: 4px solid #fff;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            overflow: hidden;
            cursor: pointer;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: rgba(0, 0, 0, 0.4);
            color: white;
            text-align: center;
            padding: 20px;
            z-index: 30;
        }
        .overlay h1 {
            font-size: 36px;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }
        .score-line {
            font-size: 26px;
            font-weight: bold;
            margin-bottom: 8px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        .score-display-emoji {
            font-size: 1em;
            vertical-align: middle;
        }
        .credit-info {
            font-size: 20px;
            margin-bottom: 15px;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.5);
            font-weight: bold;
            background: rgba(0, 0, 0, 0.25);
            padding: 8px 16px;
            border-radius: 20px;
        }
        .btn {
            background: #ff9800;
            color: white;
            border: none;
            padding: 14px 28px;
            font-size: 22px;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
            transition: transform 0.1s;
            pointer-events: auto;
            touch-action: manipulation;
        }
        .btn:active {
            transform: scale(0.95);
        }
        .btn:disabled {
            background: #9e9e9e;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }
        .btn-tips-minimal {
            background: rgba(139, 195, 74, 0.2);
            color: rgba(255, 255, 255, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.3);
            padding: 6px 12px;
            font-size: 14px;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.1s ease;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.3);
            white-space: nowrap;
            pointer-events: auto;
        }
        .btn-tips-minimal.btn-pressed {
            background: #689F38;
            color: white;
            box-shadow: inset 0 1px 2px rgba(0,0,0,0.2);
            border-color: #689F38;
        }
        .btn-tips-minimal:disabled {
            background: rgba(205, 220, 57, 0.1);
            color: rgba(255, 255, 255, 0.4);
            border-color: rgba(255, 255, 255, 0.1);
            cursor: not-allowed;
        }
        #score-display {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 48px;
            font-weight: bold;
            color: white;
            text-shadow: 3px 3px 0 #000, -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000, 1px 1px 0 #000;
            z-index: 10;
        }
        #credit-popup {
            position: absolute;
            top: 75px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 16px;
            font-weight: bold;
            color: #ffe082;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.8);
            opacity: 0;
            transition: opacity 0.3s ease, transform 0.3s ease;
            z-index: 15;
            pointer-events: none;
        }
        #credit-popup.show {
            opacity: 1;
            transform: translateX(-50%) translateY(-5px);
        }
        .options-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            margin-top: 15px;
            color: white;
            font-weight: bold;
        }
        .level-start-options {
            display: flex;
            gap: 10px;
        }
        #temp-message {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.85);
            color: white;
            padding: 15px 25px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.5);
            z-index: 40;
            opacity: 0;
            transition: opacity 0.3s ease;
            pointer-events: none;
            text-align: center;
            border: 2px solid #ff9800;
        }
        #temp-message.show {
            opacity: 1;
        }
        footer {
            margin-top: 8px;
            text-align: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            font-size: 11px;
            color: #ffffff;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.5);
        }
        footer a {
            color: #ffe082;
            text-decoration: none;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div id="game-container">
    <div id="score-display">0 🥚</div>
    <div id="credit-popup">+1 🥚</div>
    <div id="temp-message"></div>
    
    <canvas id="gameCanvas" width="360" height="640"></canvas>
    
    <div id="start-screen" class="overlay">
        <h1 id="start-title">FlapUp! <span id="start-title-emoji">🐣</span></h1>
        <div id="start-credit-display" class="credit-info">🪺 5</div>
        
        <div class="options-container">
            <div class="guide-control">
                <button id="guide-toggle-btn-start" class="btn-tips-minimal">💡Tips (1🥚)</button>
            </div>
            <div class="level-start-options">
                <button id="start-level-30-btn" class="btn-tips-minimal" style="display:none;"></button>
                <button id="start-level-50-btn" class="btn-tips-minimal" style="display:none;"></button>
            </div>
        </div>

        <p style="margin-bottom: 15px; margin-top: 15px;">Touchez l'écran pour voler et éviter les obstacles !</p>
        <button id="start-btn" class="btn">JOUER</button>
    </div>

    <div id="game-over-screen" class="overlay" style="display: none;">
        <h1>🍗 GAME OVER</h1>
        <div class="score-line">
            Score : <span id="final-score-value">0</span> <span id="final-score-emoji" class="score-display-emoji"></span>
        </div>
        <div class="score-line">
            Meilleur Score : <span id="best-score-value">0</span> <span id="best-score-emoji" class="score-display-emoji"></span>
        </div>
        <div id="gameover-credit-display" class="credit-info" style="margin-top: 5px;">🪺 5</div>

        <div class="options-container" style="margin-bottom: 15px;">
            <div class="guide-control">
                <button id="guide-toggle-btn-gameover" class="btn-tips-minimal">💡Tips (1🥚)</button>
            </div>
            <div class="level-start-options">
                <button id="gameover-level-30-btn" class="btn-tips-minimal" style="display:none;"></button>
                <button id="gameover-level-50-btn" class="btn-tips-minimal" style="display:none;"></button>
            </div>
        </div>

        <button id="restart-btn" class="btn">REJOUER</button>
    </div>
</div>

<footer>
    © 2026 FlapUp! - Tous droits réservés. <a href="https://github.com/VOTRE_PSEUDO/VOTRE_DEPOT" target="_blank">🌐 Code Source GitHub</a>
</footer>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    
    ctx.imageSmoothingEnabled = true;
    ctx.imageSmoothingQuality = 'high';

    const scoreDisplay = document.getElementById('score-display');
    const startScreen = document.getElementById('start-screen');
    const gameOverScreen = document.getElementById('game-over-screen');
    const finalScoreValueDisplay = document.getElementById('final-score-value');
    const finalScoreEmojiDisplay = document.getElementById('final-score-emoji');
    const bestScoreValueDisplay = document.getElementById('best-score-value');
    const bestScoreEmojiDisplay = document.getElementById('best-score-emoji');
    const startCreditDisplay = document.getElementById('start-credit-display');
    const gameOverCreditDisplay = document.getElementById('gameover-credit-display');
    const startBtn = document.getElementById('start-btn');
    const restartBtn = document.getElementById('restart-btn');
    const startTitleEmoji = document.getElementById('start-title-emoji');
    const creditPopup = document.getElementById('credit-popup');

    const guideToggleBtnStart = document.getElementById('guide-toggle-btn-start');
    const guideToggleBtnGameover = document.getElementById('guide-toggle-btn-gameover');
    const startLevel30Btn = document.getElementById('start-level-30-btn');
    const startLevel50Btn = document.getElementById('start-level-50-btn');
    const gameoverLevel30Btn = document.getElementById('gameover-level-30-btn');
    const gameoverLevel50Btn = document.getElementById('gameover-level-50-btn');

    const tempMessage = document.getElementById('temp-message');
    const container = document.getElementById('game-container');

    let gameState = 'START';
    let score = 0;
    let bestScore = 0;
    let credits = 5;
    let lastCreditTime = Date.now();
    let showOptimalPathGuide = false;
    let guideRequestedForNextGame = false;
    let selectedStartLevel = 0;

    const MAX_CREDITS = 5;
    const REFILL_TIME_MS = 10 * 60 * 1000;
    const COST_NORMAL_GAME = 1;
    const COST_GUIDE_OPTION = 1;
    const COST_LEVEL_30 = 10;
    const COST_LEVEL_50 = 20;

    function getPlayerEmojiForScore(s) {
        if (s >= 120) return '🐉';
        else if (s >= 90) return '🐦‍🔥';
        else if (s >= 80) return '🦚';
        else if (s >= 70) return '🕊️';
        else if (s >= 60) return '🦃';
        else if (s >= 50) return '🐓';
        else if (s >= 40) return '🐦‍⬛';
        else if (s >= 30) return '🦜';
        else if (s >= 20) return '🐦';
        else if (s >= 10) return '🐥';
        else return '🐣'; 
    }

    try {
        bestScore = parseInt(localStorage.getItem('flapup_best')) || 0;
        const savedCredits = localStorage.getItem('flapup_credits');
        const savedTime = localStorage.getItem('flapup_last_time');
        const savedGuidePref = localStorage.getItem('flapup_guide_pref'); 
        const savedStartLevelPref = localStorage.getItem('flapup_start_level_pref');

        if (savedCredits !== null) credits = parseInt(savedCredits, 10);
        if (savedTime !== null) lastCreditTime = parseInt(savedTime, 10);
        if (savedGuidePref !== null) guideRequestedForNextGame = (savedGuidePref === 'true'); 
        if (savedStartLevelPref !== null) selectedStartLevel = parseInt(savedStartLevelPref, 10);
    } catch (e) {
        console.warn("LocalStorage non disponible :", e);
    }

    if (bestScore > 0) {
        startTitleEmoji.textContent = getPlayerEmojiForScore(bestScore);
    } else {
        startTitleEmoji.textContent = '🐣';
    }

    function saveGameData() {
        try {
            localStorage.setItem('flapup_best', bestScore);
            localStorage.setItem('flapup_credits', credits);
            localStorage.setItem('flapup_last_time', lastCreditTime);
            localStorage.setItem('flapup_guide_pref', guideRequestedForNextGame); 
            localStorage.setItem('flapup_start_level_pref', selectedStartLevel);
        } catch (e) {
            console.warn("Impossible de sauvegarder :", e);
        }
    }

    let tempMessageTimeout = null;
    function showTemporaryMessage(message, duration = 2500) {
        tempMessage.textContent = message;
        tempMessage.classList.add('show');
        if (tempMessageTimeout) clearTimeout(tempMessageTimeout);
        tempMessageTimeout = setTimeout(() => {
            tempMessage.classList.remove('show');
        }, duration);
    }

    function updateCreditsSystem() {
        const now = Date.now();
        if (credits < MAX_CREDITS) {
            let elapsed = now - lastCreditTime;
            if (elapsed >= REFILL_TIME_MS) {
                const addedCredits = Math.floor(elapsed / REFILL_TIME_MS);
                credits = Math.min(MAX_CREDITS, credits + addedCredits);
                lastCreditTime = lastCreditTime + (addedCredits * REFILL_TIME_MS);
                if (credits === MAX_CREDITS) {
                    lastCreditTime = now;
                }
                saveGameData();
            }
        } else {
            lastCreditTime = now; 
        }
    }

    function getCreditDisplayString() {
        updateCreditsSystem();
        if (credits > 0) {
            if (credits < MAX_CREDITS) { 
                let elapsed = Date.now() - lastCreditTime;
                let remainingMs = REFILL_TIME_MS - elapsed;
                let remainingMinutes = Math.ceil(remainingMs / (60 * 1000));
                return `🪺 ${credits} (+1 dans ${remainingMinutes} min)`;
            } else {
                return `🪺 ${credits}`;
            }
        } else {
            let elapsed = Date.now() - lastCreditTime;
            let remainingMs = REFILL_TIME_MS - elapsed;
            let remainingMinutes = Math.ceil(remainingMs / (60 * 1000));
            return `🪹 0 (+1 dans ${remainingMinutes} min)`;
        }
    }

    function refreshUI() {
        const creditText = getCreditDisplayString();
        startCreditDisplay.textContent = creditText;
        gameOverCreditDisplay.textContent = creditText;

        let baseGameCost = COST_NORMAL_GAME;
        if (guideRequestedForNextGame) {
            baseGameCost += COST_GUIDE_OPTION;
        }

        let currentTotalGameCost = baseGameCost;
        if (selectedStartLevel === 30) {
            currentTotalGameCost += COST_LEVEL_30;
        } else if (selectedStartLevel === 50) {
            currentTotalGameCost += COST_LEVEL_50;
        }
        
        const canPlay = (credits >= currentTotalGameCost);
        
        startBtn.disabled = !canPlay;
        restartBtn.disabled = !canPlay;
        startBtn.style.background = startBtn.disabled ? '#9e9e9e' : '#ff9800';
        restartBtn.style.background = restartBtn.disabled ? '#9e9e9e' : '#ff9800';

        const currentGuideBtn = (gameState === 'START') ? guideToggleBtnStart : guideToggleBtnGameover;
        currentGuideBtn.classList.toggle('btn-pressed', guideRequestedForNextGame);
        currentGuideBtn.disabled = (credits === 0);
        
        const currentLevel30Btn = (gameState === 'START') ? startLevel30Btn : gameoverLevel30Btn;
        const currentLevel50Btn = (gameState === 'START') ? startLevel50Btn : gameoverLevel50Btn;

        if (bestScore >= 30) {
            currentLevel30Btn.style.display = 'inline-block';
            currentLevel30Btn.textContent = `Lvl 30 ${getPlayerEmojiForScore(30)} 🔙 (${COST_LEVEL_30}🥚)`;
            currentLevel30Btn.classList.toggle('btn-pressed', selectedStartLevel === 30);
            currentLevel30Btn.disabled = (credits === 0);
        } else {
            currentLevel30Btn.style.display = 'none';
        }

        if (bestScore >= 50) {
            currentLevel50Btn.style.display = 'inline-block';
            currentLevel50Btn.textContent = `Lvl 50 ${getPlayerEmojiForScore(50)} 🔙 (${COST_LEVEL_50}🥚)`;
            currentLevel50Btn.classList.toggle('btn-pressed', selectedStartLevel === 50);
            currentLevel50Btn.disabled = (credits === 0);
        } else {
            currentLevel50Btn.style.display = 'none';
        }
    }

    function toggleGuidePreference() {
        guideRequestedForNextGame = !guideRequestedForNextGame;
        saveGameData(); 
        refreshUI(); 
    }

    function toggleStartLevel(level) {
        selectedStartLevel = (selectedStartLevel === level) ? 0 : level;
        saveGameData();
        refreshUI();
    }

    guideToggleBtnStart.addEventListener('click', (e) => { e.stopPropagation(); toggleGuidePreference(); });
    guideToggleBtnGameover.addEventListener('click', (e) => { e.stopPropagation(); toggleGuidePreference(); });
    startLevel30Btn.addEventListener('click', (e) => { e.stopPropagation(); toggleStartLevel(30); });
    startLevel50Btn.addEventListener('click', (e) => { e.stopPropagation(); toggleStartLevel(50); });
    gameoverLevel30Btn.addEventListener('click', (e) => { e.stopPropagation(); toggleStartLevel(30); });
    gameoverLevel50Btn.addEventListener('click', (e) => { e.stopPropagation(); toggleStartLevel(50); });

    let popupTimeout = null;
    function showCreditPopup() {
        creditPopup.classList.add('show');
        if (popupTimeout) clearTimeout(popupTimeout);
        popupTimeout = setTimeout(() => {
            creditPopup.classList.remove('show');
        }, 1500);
    }

    let firstJumpOccurred = false; 
    const bird = { x: 60, y: 280, radius: 12, gravity: 0.28, jump: -6.4, velocity: 0, emoji: '🥚' };

    let pipes = [];
    const pipeWidth = 50;
    const pipeGap = 165;
    const pipeSpeed = 2.0;
    let frameCount = 0;

    let clouds = [
        { x: 50, y: 100, speed: 0.5, size: 30, opacity: 0.4 },
        { x: 220, y: 180, speed: 0.3, size: 24, opacity: 0.3 },
        { x: 340, y: 80, speed: 0.4, size: 35, opacity: 0.25 }
    ];

    function getObstacleEmojiForScore(s) {
        if (s >= 100) return '🔥';
        else if (s >= 80) return '⛓️';
        else if (s >= 70) return '🚧';
        else if (s >= 60) return '🧱';
        else if (s >= 50) return '🛢️';
        else if (s >= 40) return '🗿';
        else if (s >= 30) return '🪨';
        else if (s >= 20) return '🎍';
        else if (s >= 10) return '🌵';
        else return '🪵';
    }

    function shouldMirrorPlayerEmoji(emoji) {
        return ['🐦', '🦜', '🐓', '🦃', '🕊️', '🐉', '🦚'].includes(emoji);
    }

    function updateBirdEmoji() {
        if (score > 0 && score % 10 === 0) { 
            credits++; 
            saveGameData();
            showCreditPopup();
        }

        const newPlayerEmoji = (score === 0 && !firstJumpOccurred) ? '🥚' : getPlayerEmojiForScore(score);
        if (bird.emoji !== newPlayerEmoji) {
            bird.emoji = newPlayerEmoji;
        }
        scoreDisplay.textContent = score + ' ' + bird.emoji;
    }

    function resetGame() {
        bird.y = 280;
        bird.velocity = 0;
        pipes = [];
        score = 0;
        firstJumpOccurred = false;
        bird.emoji = '🥚';
        scoreDisplay.textContent = score + ' ' + bird.emoji;
        frameCount = 0;
    }

    function jump() {
        if (gameState === 'PLAYING') {
            if (!firstJumpOccurred) {
                firstJumpOccurred = true;
                updateBirdEmoji();
            }
            bird.velocity = bird.jump;
        }
    }

    container.addEventListener('touchstart', (e) => {
        if (gameState === 'PLAYING') {
            if (e.cancelable) e.preventDefault();
            jump();
        }
    }, { passive: false });

    container.addEventListener('mousedown', () => {
        if (gameState === 'PLAYING') {
            jump();
        }
    });

    window.addEventListener('keydown', (e) => {
        if (e.code === 'Space') {
            e.preventDefault();
            if (gameState === 'PLAYING') {
                jump();
            }
        }
    });

    function startGame(e) {
        if (e) {
            e.stopPropagation();
            e.preventDefault();
        }
        
        updateCreditsSystem(); 

        let gameCost = COST_NORMAL_GAME;
        if (guideRequestedForNextGame) gameCost += COST_GUIDE_OPTION;
        if (selectedStartLevel === 30) gameCost += COST_LEVEL_30;
        if (selectedStartLevel === 50) gameCost += COST_LEVEL_50;

        if (credits < gameCost) {
            showTemporaryMessage(`Crédits insuffisants ! (${gameCost} 🥚 requis, vous en avez ${credits}).`);
            refreshUI(); 
            return;
        }

        credits -= gameCost;
        saveGameData();
        showOptimalPathGuide = guideRequestedForNextGame; 
        
        resetGame(); 

        if (selectedStartLevel > 0) {
            score = selectedStartLevel;
            bird.emoji = getPlayerEmojiForScore(selectedStartLevel);
            scoreDisplay.textContent = score + ' ' + bird.emoji;
            firstJumpOccurred = true;
        }

        gameState = 'PLAYING';
        startScreen.style.display = 'none';
        gameOverScreen.style.display = 'none';
        tempMessage.classList.remove('show'); 
    }

    startBtn.addEventListener('click', startGame);
    startBtn.addEventListener('touchend', (e) => { e.preventDefault(); startGame(e); });

    restartBtn.addEventListener('click', startGame);
    restartBtn.addEventListener('touchend', (e) => { e.preventDefault(); startGame(e); });

    function spawnPipe() {
        const minHeight = 50;
        const maxHeight = canvas.height - pipeGap - minHeight - 60;
        const topHeight = Math.floor(Math.random() * (maxHeight - minHeight + 1)) + minHeight;
        
        pipes.push({
            x: canvas.width,
            top: topHeight,
            bottom: canvas.height - topHeight - pipeGap,
            passed: false
        });
    }

    function update() {
        updateCreditsSystem();

        clouds.forEach(cloud => {
            cloud.x -= cloud.speed;
            if (cloud.x < -50) {
                cloud.x = canvas.width + 50;
                cloud.y = Math.random() * 200 + 30;
            }
        });

        if (gameState !== 'PLAYING') return;

        frameCount++;
        bird.velocity += bird.gravity;
        bird.y += bird.velocity;

        if (bird.y + bird.radius >= canvas.height - 40 || bird.y - bird.radius <= 0) {
            triggerGameOver();
        }

        if (frameCount % 105 === 0) {
            spawnPipe();
        }

        for (let i = pipes.length - 1; i >= 0; i--) {
            let p = pipes[i];
            p.x -= pipeSpeed;

            let birdLeft = bird.x - bird.radius;
            let birdRight = bird.x + bird.radius;
            let birdTop = bird.y - bird.radius;
            let birdBottom = bird.y + bird.radius;

            if (birdRight > p.x && birdLeft < p.x + pipeWidth) {
                if (birdTop < p.top || birdBottom > canvas.height - p.bottom) {
                    triggerGameOver();
                }
            }

            if (!p.passed && p.x + pipeWidth < bird.x) {
                p.passed = true;
                score++;
                updateBirdEmoji();
            }

            if (p.x + pipeWidth < 0) {
                pipes.splice(i, 1);
            }
        }
    }

    function drawPipeSection(x, startY, height, emoji) {
        ctx.font = '32px "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        
        const emojiHeight = 35;
        const count = Math.ceil(height / emojiHeight);
        
        ctx.save();
        ctx.beginPath();
        ctx.rect(x, startY, pipeWidth, height);
        ctx.clip();
        
        for (let i = 0; i < count; i++) {
            let y = startY + (i * emojiHeight) + 18;
            ctx.shadowColor = 'rgba(0, 0, 0, 0.25)';
            ctx.shadowBlur = 4;
            ctx.shadowOffsetX = 1;
            ctx.shadowOffsetY = 2;
            ctx.fillText(emoji, x + pipeWidth / 2, y);
        }
        ctx.restore();
    }

    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        clouds.forEach(cloud => {
            ctx.save();
            ctx.globalAlpha = cloud.opacity;
            ctx.font = `${cloud.size}px "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('☁️', cloud.x, cloud.y);
            ctx.restore();
        });

        const currentObstacleEmoji = getObstacleEmojiForScore(score);
        pipes.forEach(p => {
            drawPipeSection(p.x, 0, p.top, currentObstacleEmoji);
            drawPipeSection(p.x, canvas.height - p.bottom, p.bottom, currentObstacleEmoji);
        });

        ctx.fillStyle = '#c4bc75';
        ctx.fillRect(0, canvas.height - 40, canvas.width, 40);
        ctx.fillStyle = '#8ab23f';
        ctx.fillRect(0, canvas.height - 40, canvas.width, 6);

        ctx.save();
        ctx.translate(bird.x, bird.y);
        let angle = Math.min(Math.max(bird.velocity * 0.04, -0.4), 0.6);
        ctx.rotate(angle);

        if (shouldMirrorPlayerEmoji(bird.emoji)) {
            ctx.scale(-1, 1);
            ctx.translate(-36, 0); 
        }

        ctx.shadowColor = 'rgba(0, 0, 0, 0.3)';
        ctx.shadowBlur = 6;
        ctx.shadowOffsetX = 2;
        ctx.shadowOffsetY = 3;

        ctx.font = '36px "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(bird.emoji, 0, 0);
        ctx.restore();

        if (gameState === 'PLAYING' && showOptimalPathGuide) {
            const nextPipe = pipes.find(p => p.x + pipeWidth > bird.x);
            if (nextPipe) {
                const pipeCenterY = nextPipe.top + (pipeGap / 2);
                ctx.beginPath();
                ctx.setLineDash([5, 5]); 
                ctx.strokeStyle = 'rgba(255, 255, 0, 0.7)'; 
                ctx.lineWidth = 2;
                ctx.moveTo(nextPipe.x, pipeCenterY);
                ctx.lineTo(nextPipe.x + pipeWidth, pipeCenterY);
                ctx.stroke();
                ctx.setLineDash([]); 
            }
        }
    }

    function triggerGameOver() {
        gameState = 'GAMEOVER';
        if (score > bestScore) {
            bestScore = score;
            startTitleEmoji.textContent = getPlayerEmojiForScore(bestScore);
        }
        saveGameData();

        finalScoreValueDisplay.textContent = score;
        finalScoreEmojiDisplay.textContent = getPlayerEmojiForScore(score);
        bestScoreValueDisplay.textContent = bestScore;
        bestScoreEmojiDisplay.textContent = getPlayerEmojiForScore(bestScore);
        
        refreshUI();
        gameOverScreen.style.display = 'flex';
    }

    function loop() {
        update();
        draw();
        requestAnimationFrame(loop);
    }

    refreshUI();
    loop();
</script>
</body>
