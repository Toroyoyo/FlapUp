<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>🍳 Flappy</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #70c5ce;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
            touch-action: manipulation;
        }
        #game-container {
            position: relative;
            width: 360px;
            height: 640px;
            background: linear-gradient(to bottom, #4ec0ca 0%, #70c5ce 70%, #ded895 70%, #e0d995 100%);
            border: 4px solid #fff;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            overflow: hidden;
            cursor: pointer;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: rgba(0, 0, 0, 0.4);
            color: white;
            text-align: center;
            padding: 20px;
        }
        .overlay h1 {
            font-size: 36px;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }
        .score-line {
            font-size: 26px;
            font-weight: bold;
            margin-bottom: 8px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        .score-display-emoji {
            font-size: 1em;
            vertical-align: middle;
        }
        .credit-info {
            font-size: 20px;
            margin-bottom: 15px;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.5);
            font-weight: bold;
            background: rgba(0, 0, 0, 0.25);
            padding: 8px 16px;
            border-radius: 20px;
        }
        .btn {
            background: #ff9800;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 20px;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
            transition: transform 0.1s;
        }
        .btn:active {
            transform: scale(0.95);
        }
        .btn:disabled {
            background: #9e9e9e;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }
        /* Style pour les petits boutons */
        .btn-small {
            /* Ces propriétés sont maintenant surchargées par .btn-tips-minimal */
        }

        /* Nouveau style pour le bouton Tips et les boutons de niveau */
        .btn-tips-minimal {
            background: rgba(139, 195, 74, 0.2); /* Vert très clair, semi-transparent */
            color: rgba(255, 255, 255, 0.8); /* Texte blanc subtil */
            border: 1px solid rgba(255, 255, 255, 0.3); /* Bordure fine et discrète */
            padding: 4px 10px; /* Padding réduit */
            font-size: 14px; /* Taille de police réduite */
            font-weight: bold;
            border-radius: 10px; /* Rayon de bordure réduit */
            cursor: pointer;
            box-shadow: none; /* Pas d'ombre par défaut */
            transition: all 0.1s ease; /* Transition douce */
            text-shadow: 1px 1px 2px rgba(0,0,0,0.3); /* Ombre pour le texte pour la lisibilité */
            white-space: nowrap; /* Empêche le texte de s'enrouler */
        }
        /* Style pour l'état 'appuyé' du bouton Tips */
        .btn-tips-minimal.btn-pressed {
            background: #689F38; /* Vert plus foncé quand actif */
            color: white;
            box-shadow: inset 0 1px 2px rgba(0,0,0,0.2); /* Ombre interne subtile */
            transform: translateY(0.5px); /* Léger décalage vers le bas */
            border-color: #689F38; /* Bordure de la même couleur que le fond */
        }
        /* Style pour les boutons Tips désactivés */
        .btn-tips-minimal:disabled {
            background: rgba(205, 220, 57, 0.1); /* Fond semi-transparent plus pâle */
            color: rgba(255, 255, 255, 0.4); /* Texte très estompé */
            border-color: rgba(255, 255, 255, 0.1); /* Bordure très estompée */
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        #score-display {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 48px;
            font-weight: bold;
            color: white;
            text-shadow: 3px 3px 0 #000, -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000, 1px 1px 0 #000;
            z-index: 10;
        }
        #credit-popup {
            position: absolute;
            top: 75px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 16px;
            font-weight: bold;
            color: #ffe082;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.8);
            opacity: 0;
            transition: opacity 0.3s ease, transform 0.3s ease;
            z-index: 15;
            pointer-events: none;
        }
        #credit-popup.show {
            opacity: 1;
            transform: translateX(-50%) translateY(-5px);
        }

        /* Conteneur pour toutes les options (Tips et niveaux de départ) */
        .options-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px; /* Espacement entre les lignes d'options */
            margin-top: 15px;
            /* background: rgba(0, 0, 0, 0.25);  A commenter ou enlever pour un design plus épuré */
            padding: 0; 
            border-radius: 20px;
            color: white;
            font-weight: bold;
        }
        /* Conteneur pour les boutons de sélection de niveau de départ */
        .level-start-options {
            display: flex;
            gap: 10px; /* Espacement entre les boutons de niveau */
        }

        #temp-message { /* Style pour les messages temporaires */
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(255, 0, 0, 0.8);
            color: white;
            padding: 15px 25px;
            border-radius: 10px;
            font-size: 18px;
            font-weight: bold;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.5);
            z-index: 20;
            opacity: 0;
            transition: opacity 0.3s ease;
            pointer-events: none; /* Permet de cliquer à travers */
        }
        #temp-message.show {
            opacity: 1;
        }
    </style>
</head>
<body>

<div id="game-container">
    <div id="score-display">0 🥚</div>
    <div id="credit-popup">+1 🥚</div>
    <div id="temp-message"></div> <!-- Pour les messages temporaires -->
    
    <canvas id="gameCanvas" width="360" height="640"></canvas>
    
    <div id="start-screen" class="overlay">
        <h1 id="start-title">Flap Flap <span id="start-title-emoji">🐣</span></h1>
        <div id="start-credit-display" class="credit-info">🪺 5</div>
        
        <!-- Conteneur pour toutes les options de démarrage -->
        <div class="options-container">
            <div class="guide-control">
                <button id="guide-toggle-btn-start" class="btn-tips-minimal">💡Tips (1🥚)</button>
            </div>
            <!-- NOUVEAU : Conteneur pour les boutons de sélection de niveau de départ -->
            <div class="level-start-options">
                <button id="start-level-30-btn" class="btn-tips-minimal" style="display:none;"></button>
                <button id="start-level-50-btn" class="btn-tips-minimal" style="display:none;"></button>
            </div>
        </div>

        <p style="margin-bottom: 15px; margin-top: 15px;">Touchez l'écran pour voler et éviter les obstacles !</p>
        <button id="start-btn" class="btn" onclick="startGame(event)">JOUER</button>
    </div>

    <div id="game-over-screen" class="overlay" style="display: none;">
        <h1>🍗 GAME OVER</h1>
        <div class="score-line">
            Score : <span id="final-score-value">0</span> <span id="final-score-emoji" class="score-display-emoji"></span>
        </div>
        <div class="score-line">
            Meilleur Score : <span id="best-score-value">0</span> <span id="best-score-emoji" class="score-display-emoji"></span>
        </div>
        <div id="gameover-credit-display" class="credit-info" style="margin-top: 5px;">🪺 5</div>

        <!-- Conteneur pour toutes les options de démarrage sur l'écran Game Over -->
        <div class="options-container" style="margin-bottom: 15px;">
            <div class="guide-control">
                <button id="guide-toggle-btn-gameover" class="btn-tips-minimal">💡Tips (1🥚)</button>
            </div>
            <!-- NOUVEAU : Conteneur pour les boutons de sélection de niveau de départ -->
            <div class="level-start-options">
                <button id="gameover-level-30-btn" class="btn-tips-minimal" style="display:none;"></button>
                <button id="gameover-level-50-btn" class="btn-tips-minimal" style="display:none;"></button>
            </div>
        </div>

        <button id="restart-btn" class="btn" onclick="startGame(event)">REJOUER</button>
    </div>
</div>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    
    ctx.imageSmoothingEnabled = true;
    ctx.imageSmoothingQuality = 'high';

    const scoreDisplay = document.getElementById('score-display');
    const startScreen = document.getElementById('start-screen');
    const gameOverScreen = document.getElementById('game-over-screen');
    const finalScoreValueDisplay = document.getElementById('final-score-value');
    const finalScoreEmojiDisplay = document.getElementById('final-score-emoji');
    const bestScoreValueDisplay = document.getElementById('best-score-value');
    const bestScoreEmojiDisplay = document.getElementById('best-score-emoji');
    const startCreditDisplay = document.getElementById('start-credit-display');
    const gameOverCreditDisplay = document.getElementById('gameover-credit-display');
    const startBtn = document.getElementById('start-btn');
    const restartBtn = document.getElementById('restart-btn');
    const startTitleEmoji = document.getElementById('start-title-emoji');
    const creditPopup = document.getElementById('credit-popup');

    const guideToggleBtnStart = document.getElementById('guide-toggle-btn-start');
    const guideToggleBtnGameover = document.getElementById('guide-toggle-btn-gameover');
    // NOUVEAU : Références aux boutons de sélection de niveau
    const startLevel30Btn = document.getElementById('start-level-30-btn');
    const startLevel50Btn = document.getElementById('start-level-50-btn');
    const gameoverLevel30Btn = document.getElementById('gameover-level-30-btn');
    const gameoverLevel50Btn = document.getElementById('gameover-level-50-btn');

    const tempMessage = document.getElementById('temp-message');

    const container = document.getElementById('game-container');

    let gameState = 'START';
    let score = 0;
    let bestScore = 0;
    let credits = 5;
    let lastCreditTime = Date.now();
    let showOptimalPathGuide = false; // Vrai si le guide est ACTIF pour la partie EN COURS
    let guideRequestedForNextGame = false; // Vrai si le joueur A DEMANDÉ le guide pour la prochaine partie
    let selectedStartLevel = 0; // NOUVEAU : 0 pour normal, 30 ou 50 pour les niveaux de départ

    const MAX_CREDITS = 5;
    const REFILL_TIME_MS = 10 * 60 * 1000; // 10 minutes en millisecondes
    const COST_NORMAL_GAME = 1; // Coût d'une partie normale
    const COST_GUIDE_OPTION = 1; // Coût de l'option Tips
    const COST_LEVEL_30 = 10; // NOUVEAU : Coût pour commencer au niveau 30
    const COST_LEVEL_50 = 20; // NOUVEAU : Coût pour commencer au niveau 50

    function getPlayerEmojiForScore(s) {
        if (s >= 120) return '🐉';
        else if (s >= 90) return '🐦‍🔥';
        else if (s >= 80) return '🦚';
        else if (s >= 70) return '🕊️';
        else if (s >= 60) return '🦃';
        else if (s >= 50) return '🐓';
        else if (s >= 40) return '🐦‍⬛';
        else if (s >= 30) return '🦜';
        else if (s >= 20) return '🐦';
        else if (s >= 10) return '🐥';
        else return '🐣'; 
    }

    // --- Chargement LocalStorage ---
    try {
        bestScore = parseInt(localStorage.getItem('flappy_emoji_best')) || 0;
        const savedCredits = localStorage.getItem('flappy_emoji_credits');
        const savedTime = localStorage.getItem('flappy_emoji_last_time');
        const savedGuidePref = localStorage.getItem('flappy_emoji_guide_pref'); 
        const savedStartLevelPref = localStorage.getItem('flappy_emoji_start_level_pref'); // NOUVEAU : Chargement préférence niveau de départ

        if (savedCredits !== null) credits = parseInt(savedCredits, 10);
        if (savedTime !== null) lastCreditTime = parseInt(savedTime, 10);
        if (savedGuidePref !== null) guideRequestedForNextGame = (savedGuidePref === 'true'); 
        if (savedStartLevelPref !== null) selectedStartLevel = parseInt(savedStartLevelPref, 10); // NOUVEAU : Convertir en int
    } catch (e) {
        console.warn("Impossible d'accéder à localStorage :", e);
    }

    // Mise à jour de l'emoji du titre au démarrage basé sur le meilleur score enregistré
    if (bestScore > 0) {
        startTitleEmoji.textContent = getPlayerEmojiForScore(bestScore);
    } else {
        startTitleEmoji.textContent = '🐣';
    }

    function saveGameData() {
        try {
            localStorage.setItem('flappy_emoji_best', bestScore);
            localStorage.setItem('flappy_emoji_credits', credits);
            localStorage.setItem('flappy_emoji_last_time', lastCreditTime);
            localStorage.setItem('flappy_emoji_guide_pref', guideRequestedForNextGame); 
            localStorage.setItem('flappy_emoji_start_level_pref', selectedStartLevel); // NOUVEAU : Sauvegarde préférence niveau de départ
        } catch (e) {
            console.warn("Impossible de sauvegarder dans localStorage :", e);
        }
    }

    // NOUVEAU: Fonction pour afficher un message temporaire
    let tempMessageTimeout = null;
    function showTemporaryMessage(message, duration = 2000) {
        tempMessage.textContent = message;
        tempMessage.classList.add('show');
        if (tempMessageTimeout) clearTimeout(tempMessageTimeout);
        tempMessageTimeout = setTimeout(() => {
            tempMessage.classList.remove('show');
        }, duration);
    }

    // --- Gestion des Crédits et Timer ---
    function updateCreditsSystem() {
        const now = Date.now();
        if (credits < MAX_CREDITS) {
            let elapsed = now - lastCreditTime;
            if (elapsed >= REFILL_TIME_MS) {
                const addedCredits = Math.floor(elapsed / REFILL_TIME_MS);
                credits = Math.min(MAX_CREDITS, credits + addedCredits);
                lastCreditTime = lastCreditTime + (addedCredits * REFILL_TIME_MS);
                if (credits === MAX_CREDITS) {
                    lastCreditTime = now;
                }
                saveGameData();
            }
        } else {
            lastCreditTime = now; 
        }
    }

    function getCreditDisplayString() {
        updateCreditsSystem();
        if (credits > 0) {
            if (credits < MAX_CREDITS) { 
                let elapsed = Date.now() - lastCreditTime;
                let remainingMs = REFILL_TIME_MS - elapsed;
                let remainingMinutes = Math.ceil(remainingMs / (60 * 1000));
                return `🪺 ${credits} (+1 dans ${remainingMinutes} min)`;
            } else {
                return `🪺 ${credits}`;
            }
        } else {
            let elapsed = Date.now() - lastCreditTime;
            let remainingMs = REFILL_TIME_MS - elapsed;
            let remainingMinutes = Math.ceil(remainingMs / (60 * 1000));
            return `🪹 0 (+1 dans ${remainingMinutes} min)`;
        }
    }

    function refreshUI() {
        const creditText = getCreditDisplayString();
        startCreditDisplay.textContent = creditText;
        gameOverCreditDisplay.textContent = creditText;

        // Calcul du coût de base pour une partie (sans options de niveau)
        let baseGameCost = COST_NORMAL_GAME;
        if (guideRequestedForNextGame) {
            baseGameCost += COST_GUIDE_OPTION;
        }

        // Calcul du coût total de la partie avec les options actuellement sélectionnées
        let currentTotalGameCost = baseGameCost;
        if (selectedStartLevel === 30) {
            currentTotalGameCost += COST_LEVEL_30;
        } else if (selectedStartLevel === 50) {
            currentTotalGameCost += COST_LEVEL_50;
        }
        
        const canPlay = (credits >= currentTotalGameCost);
        
        startBtn.disabled = !canPlay;
        restartBtn.disabled = !canPlay;
        startBtn.style.background = startBtn.disabled ? '#9e9e9e' : '#ff9800';
        restartBtn.style.background = restartBtn.disabled ? '#9e9e9e' : '#ff9800';

        // Gérer l'état visuel et d'activation du bouton Tips
        const currentGuideBtn = (gameState === 'START') ? guideToggleBtnStart : guideToggleBtnGameover;
        currentGuideBtn.classList.toggle('btn-pressed', guideRequestedForNextGame);
        currentGuideBtn.disabled = (credits === 0) || // Désactiver si 0 crédit
                                   (!guideRequestedForNextGame && credits < (baseGameCost + COST_GUIDE_OPTION - COST_NORMAL_GAME)); // Désactiver si on tente d'activer sans crédits suffisants pour tips seul
        
        // --- NOUVEAU : Logique pour les boutons de niveau de départ ---
        const currentLevel30Btn = (gameState === 'START') ? startLevel30Btn : gameoverLevel30Btn;
        const currentLevel50Btn = (gameState === 'START') ? startLevel50Btn : gameoverLevel50Btn;

        // Bouton niveau 30
        if (bestScore >= 30) {
            currentLevel30Btn.style.display = 'inline-block';
            currentLevel30Btn.textContent = `Lvl 30 ${getPlayerEmojiForScore(30)} 🔙 (${COST_LEVEL_30}🥚)`;
            currentLevel30Btn.classList.toggle('btn-pressed', selectedStartLevel === 30);
            
            const costIfLevel30Selected = baseGameCost + COST_LEVEL_30;
            // Le bouton est désactivé si:
            // 1. On a 0 crédit
            // 2. On n'a pas sélectionné ce niveau, ET qu'on n'a pas assez de crédits pour l'activer (coût total inclus)
            // 3. Un autre niveau est sélectionné (pour forcer une sélection unique)
            currentLevel30Btn.disabled = (credits === 0) || 
                                         (!currentLevel30Btn.classList.contains('btn-pressed') && credits < costIfLevel30Selected) ||
                                         (selectedStartLevel !== 0 && selectedStartLevel !== 30);
        } else {
            currentLevel30Btn.style.display = 'none';
        }

        // Bouton niveau 50
        if (bestScore >= 50) {
            currentLevel50Btn.style.display = 'inline-block';
            currentLevel50Btn.textContent = `Lvl 50 ${getPlayerEmojiForScore(50)} 🔙 (${COST_LEVEL_50}🥚)`;
            currentLevel50Btn.classList.toggle('btn-pressed', selectedStartLevel === 50);

            const costIfLevel50Selected = baseGameCost + COST_LEVEL_50;
            currentLevel50Btn.disabled = (credits === 0) || 
                                         (!currentLevel50Btn.classList.contains('btn-pressed') && credits < costIfLevel50Selected) ||
                                         (selectedStartLevel !== 0 && selectedStartLevel !== 50);
        } else {
            currentLevel50Btn.style.display = 'none';
        }
    }

    // Gestion du toggle du guide
    function toggleGuidePreference() {
        // Simule le coût si on active/désactive le guide
        let potentialBaseCost = COST_NORMAL_GAME;
        if (!guideRequestedForNextGame) { // Si on est sur le point d'ACTIVER le guide
            potentialBaseCost += COST_GUIDE_OPTION;
        }

        let potentialTotalCost = potentialBaseCost;
        if (selectedStartLevel === 30) potentialTotalCost += COST_LEVEL_30;
        if (selectedStartLevel === 50) potentialTotalCost += COST_LEVEL_50;

        // Si on essaie d'activer le guide et qu'on n'a pas assez de crédits pour la configuration totale
        if (!guideRequestedForNextGame && credits < potentialTotalCost) {
            showTemporaryMessage(`Il faut ${potentialTotalCost} 🥚 pour cette configuration (Tips inclus).`);
            return;
        }

        guideRequestedForNextGame = !guideRequestedForNextGame;
        saveGameData(); 
        refreshUI(); 
    }

    // NOUVEAU : Gestion du toggle des niveaux de départ
    function toggleStartLevel(level) {
        let newSelectedLevel = 0; // Par défaut, pas de niveau de départ sélectionné

        // Si le niveau est déjà sélectionné, le désélectionner (revenir à 0)
        if (selectedStartLevel === level) {
            newSelectedLevel = 0;
        } else {
            newSelectedLevel = level;
        }

        // Calcul du coût potentiel avec cette nouvelle sélection de niveau
        let potentialTotalCost = COST_NORMAL_GAME;
        if (guideRequestedForNextGame) potentialTotalCost += COST_GUIDE_OPTION;
        if (newSelectedLevel === 30) potentialTotalCost += COST_LEVEL_30;
        if (newSelectedLevel === 50) potentialTotalCost += COST_LEVEL_50;

        // Vérifier si le joueur peut se permettre cette sélection de niveau
        // (Uniquement si on essaie d'ACTIVER un niveau de départ)
        if (newSelectedLevel !== 0 && credits < potentialTotalCost) {
            showTemporaryMessage(`Il faut ${potentialTotalCost} 🥚 pour cette configuration (Niveau ${newSelectedLevel} inclus).`);
            return; // Annuler la sélection
        }

        selectedStartLevel = newSelectedLevel;
        saveGameData();
        refreshUI();
    }


    // Ajout des écouteurs d'événements pour les boutons des options
    guideToggleBtnStart.addEventListener('click', toggleGuidePreference);
    guideToggleBtnGameover.addEventListener('click', toggleGuidePreference);
    // NOUVEAU : Écouteurs pour les boutons de niveau
    startLevel30Btn.addEventListener('click', () => toggleStartLevel(30));
    startLevel50Btn.addEventListener('click', () => toggleStartLevel(50));
    gameoverLevel30Btn.addEventListener('click', () => toggleStartLevel(30));
    gameoverLevel50Btn.addEventListener('click', () => toggleStartLevel(50));

    let popupTimeout = null;
    function showCreditPopup() {
        creditPopup.classList.add('show');
        if (popupTimeout) clearTimeout(popupTimeout);
        popupTimeout = setTimeout(() => {
            creditPopup.classList.remove('show');
        }, 1500);
    }

    let firstJumpOccurred = false; 

    const bird = {
        x: 60,
        y: 280,
        radius: 12, 
        gravity: 0.28,
        jump: -6.4,
        velocity: 0,
        emoji: '🥚'
    };

    let pipes = [];
    const pipeWidth = 50;
    const pipeGap = 165;
    const pipeSpeed = 2.0;
    let frameCount = 0;

    let clouds = [
        { x: 50, y: 100, speed: 0.5, size: 30, opacity: 0.4 },
        { x: 220, y: 180, speed: 0.3, size: 24, opacity: 0.3 },
        { x: 340, y: 80, speed: 0.4, size: 35, opacity: 0.25 }
    ];

    function getObstacleEmojiForScore(s) {
        if (s >= 100) return '🔥';
        else if (s >= 80) return '⛓️';
        else if (s >= 70) return '🚧';
        else if (s >= 60) return '🧱';
        else if (s >= 50) return '🛢️';
        else if (s >= 40) return '🗿';
        else if (s >= 30) return '🪨';
        else if (s >= 20) return '🎍';
        else if (s >= 10) return '🌵';
        else return '🪵';
    }

    function shouldMirrorPlayerEmoji(emoji) {
        return ['🐦', '🦜', '🐓', '🦃', '🕊️', '🐉', '🦚'].includes(emoji);
    }
    
    function shouldMirrorObstacleEmoji(emoji) {
        return false;
    }

    function updateBirdEmoji() {
        if (score > 0 && score % 10 === 0) { 
            credits++; 
            saveGameData();
            showCreditPopup();
        }

        const newPlayerEmoji = (score === 0 && !firstJumpOccurred) ? '🥚' : getPlayerEmojiForScore(score);
        if (bird.emoji !== newPlayerEmoji) {
            bird.emoji = newPlayerEmoji;
        }
        scoreDisplay.textContent = score + ' ' + bird.emoji;
    }

    function resetGame() {
        bird.y = 280;
        bird.velocity = 0;
        pipes = [];
        score = 0; // Réinitialise le score à 0
        firstJumpOccurred = false;
        bird.emoji = '🥚'; // Réinitialise l'emoji de l'oiseau à l'œuf par défaut
        scoreDisplay.textContent = score + ' ' + bird.emoji;
        frameCount = 0;
    }

    function jump() {
        if (gameState === 'PLAYING') {
            if (!firstJumpOccurred) {
                firstJumpOccurred = true;
                updateBirdEmoji();
            }
            bird.velocity = bird.jump;
        }
    }

    function handleInput(e) {
        if (e.target.tagName !== 'BUTTON') {
            if (e.cancelable) e.preventDefault();
            jump();
        }
    }

    container.addEventListener('touchstart', handleInput, { passive: false });
    container.addEventListener('mousedown', handleInput);

    window.addEventListener('keydown', (e) => {
        if (e.code === 'Space') {
            e.preventDefault();
            if (gameState === 'START' || gameState === 'GAMEOVER') {
                startGame(); 
            } else {
                jump();
            }
        }
    });

    function startGame(e) {
        if (e) e.stopPropagation(); 

        updateCreditsSystem(); 

        // Calcul du coût total de la partie avec toutes les options choisies
        let gameCost = COST_NORMAL_GAME;
        if (guideRequestedForNextGame) gameCost += COST_GUIDE_OPTION;
        if (selectedStartLevel === 30) gameCost += COST_LEVEL_30;
        if (selectedStartLevel === 50) gameCost += COST_LEVEL_50;

        if (credits < gameCost) {
            let message = "Vous n'avez pas assez de crédits pour lancer la partie.";
            message += ` Coût actuel : ${gameCost} 🥚.`;
            showTemporaryMessage(message);
            refreshUI(); 
            return;
        }

        // Déduction des crédits
        credits -= gameCost;
        saveGameData();

        showOptimalPathGuide = guideRequestedForNextGame; 
        
        // Réinitialise le jeu à l'état par défaut (score 0, œuf)
        resetGame(); 

        // Applique les modifications de démarrage si un niveau de départ a été choisi
        if (selectedStartLevel > 0) {
            score = selectedStartLevel; // Définit le score initial
            bird.emoji = getPlayerEmojiForScore(selectedStartLevel); // Définit l'emoji de l'oiseau initial
            scoreDisplay.textContent = score + ' ' + bird.emoji;
            firstJumpOccurred = true; // Simule un premier saut pour que l'emoji du joueur s'affiche correctement
        }

        gameState = 'PLAYING';
        startScreen.style.display = 'none';
        gameOverScreen.style.display = 'none';
        tempMessage.classList.remove('show'); 
    }

    function spawnPipe() {
        const minHeight = 50;
        const maxHeight = canvas.height - pipeGap - minHeight - 60;
        const topHeight = Math.floor(Math.random() * (maxHeight - minHeight + 1)) + minHeight;
        
        pipes.push({
            x: canvas.width,
            top: topHeight,
            bottom: canvas.height - topHeight - pipeGap,
            passed: false
        });
    }

    function update() {
        updateCreditsSystem();

        clouds.forEach(cloud => {
            cloud.x -= cloud.speed;
            if (cloud.x < -50) {
                cloud.x = canvas.width + 50;
                cloud.y = Math.random() * 200 + 30;
            }
        });

        if (gameState !== 'PLAYING') return;

        frameCount++;

        bird.velocity += bird.gravity;
        bird.y += bird.velocity;

        if (bird.y + bird.radius >= canvas.height - 40 || bird.y - bird.radius <= 0) {
            triggerGameOver();
        }

        if (frameCount % 105 === 0) {
            spawnPipe();
        }

        for (let i = pipes.length - 1; i >= 0; i--) {
            let p = pipes[i];
            p.x -= pipeSpeed;

            let birdLeft = bird.x - bird.radius;
            let birdRight = bird.x + bird.radius;
            let birdTop = bird.y - bird.radius;
            let birdBottom = bird.y + bird.radius;

            if (birdRight > p.x && birdLeft < p.x + pipeWidth) {
                if (birdTop < p.top || birdBottom > canvas.height - p.bottom) {
                    triggerGameOver();
                }
            }

            if (!p.passed && p.x + pipeWidth < bird.x) {
                p.passed = true;
                score++;
                updateBirdEmoji();
            }

            if (p.x + pipeWidth < 0) {
                pipes.splice(i, 1);
            }
        }
    }

    function drawPipeSection(x, startY, height, emoji) {
        ctx.font = '32px "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        
        const emojiHeight = 35;
        const count = Math.ceil(height / emojiHeight);
        
        ctx.save();
        ctx.beginPath();
        ctx.rect(x, startY, pipeWidth, height);
        ctx.clip();
        
        if (shouldMirrorObstacleEmoji(emoji)) {
            ctx.translate(x + pipeWidth / 2, startY + height / 2);
            ctx.scale(-1, 1);
            ctx.translate(-(x + pipeWidth / 2), -(startY + height / 2));
        }

        for (let i = 0; i < count; i++) {
            let y = startY + (i * emojiHeight) + 18;
            
            ctx.shadowColor = 'rgba(0, 0, 0, 0.25)';
            ctx.shadowBlur = 4;
            ctx.shadowOffsetX = 1;
            ctx.shadowOffsetY = 2;

            ctx.fillText(emoji, x + pipeWidth / 2, y);
        }
        ctx.restore();
    }

    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        clouds.forEach(cloud => {
            ctx.save();
            ctx.globalAlpha = cloud.opacity;
            ctx.font = `${cloud.size}px "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('☁️', cloud.x, cloud.y);
            ctx.restore();
        });

        const currentObstacleEmoji = getObstacleEmojiForScore(score); // L'emoji d'obstacle dépend du score actuel
        pipes.forEach(p => {
            drawPipeSection(p.x, 0, p.top, currentObstacleEmoji);
            drawPipeSection(p.x, canvas.height - p.bottom, p.bottom, currentObstacleEmoji);
        });

        ctx.fillStyle = '#c4bc75';
        ctx.fillRect(0, canvas.height - 40, canvas.width, 40);
        ctx.fillStyle = '#8ab23f';
        ctx.fillRect(0, canvas.height - 40, canvas.width, 6);

        ctx.save();
        ctx.translate(bird.x, bird.y);
        let angle = Math.min(Math.max(bird.velocity * 0.04, -0.4), 0.6);
        ctx.rotate(angle);

        if (shouldMirrorPlayerEmoji(bird.emoji)) {
            ctx.scale(-1, 1);
            ctx.translate(-36, 0); 
        }

        ctx.shadowColor = 'rgba(0, 0, 0, 0.3)';
        ctx.shadowBlur = 6;
        ctx.shadowOffsetX = 2;
        ctx.shadowOffsetY = 3;

        ctx.font = '36px "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(bird.emoji, 0, 0);
        ctx.restore();

        // Affichage du guide de trajectoire
        if (gameState === 'PLAYING' && showOptimalPathGuide) {
            const nextPipe = pipes.find(p => p.x + pipeWidth > bird.x);
            if (nextPipe) {
                const pipeCenterY = nextPipe.top + (pipeGap / 2);
                ctx.beginPath();
                ctx.setLineDash([5, 5]); 
                ctx.strokeStyle = 'rgba(255, 255, 0, 0.7)'; 
                ctx.lineWidth = 2;
                ctx.moveTo(nextPipe.x, pipeCenterY);
                ctx.lineTo(nextPipe.x + pipeWidth, pipeCenterY);
                ctx.stroke();
                ctx.setLineDash([]); 
            }
        }
    }

    function triggerGameOver() {
        gameState = 'GAMEOVER';
        if (score > bestScore) {
            bestScore = score;
            startTitleEmoji.textContent = getPlayerEmojiForScore(bestScore);
        }
        saveGameData();

        finalScoreValueDisplay.textContent = score;
        finalScoreEmojiDisplay.textContent = getPlayerEmojiForScore(score);
        
        bestScoreValueDisplay.textContent = bestScore;
        bestScoreEmojiDisplay.textContent = getPlayerEmojiForScore(bestScore);
        
        refreshUI();
        gameOverScreen.style.display = 'flex';
    }

    function loop() {
        update();
        draw();
        if (gameState === 'START' || gameState === 'GAMEOVER') {
            refreshUI();
        }
        requestAnimationFrame(loop);
    }

    resetGame();
    refreshUI();
    loop();
</script>
