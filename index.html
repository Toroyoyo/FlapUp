<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
    <title>FlapUp!</title>
    <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🐣</text></svg>">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🐣</text></svg>">
    
    <!-- SDK Supabase pour la base de données en ligne -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #70c5ce;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
            touch-action: manipulation;
        }
        #game-container {
            position: relative;
            width: 360px;
            height: 640px;
            background: linear-gradient(to bottom, #4ec0ca 0%, #70c5ce 70%, #ded895 70%, #e0d995 100%);
            border: 4px solid #fff;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            overflow: hidden;
            cursor: pointer;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: rgba(0, 0, 0, 0.5);
            color: white;
            text-align: center;
            padding: 15px;
            z-index: 30;
            overflow-y: auto;
        }
        .overlay h1 {
            font-size: 32px;
            margin-bottom: 5px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }
        .score-line {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 4px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .credit-info {
            font-size: 16px;
            margin-bottom: 8px;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.5);
            font-weight: bold;
            background: rgba(0, 0, 0, 0.25);
            padding: 5px 12px;
            border-radius: 20px;
        }
        .btn {
            background: #ff9800;
            color: white;
            border: none;
            padding: 10px 24px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
            transition: transform 0.1s;
            pointer-events: auto;
            touch-action: manipulation;
            margin-top: 5px;
        }
        .btn:active {
            transform: scale(0.95);
        }
        .btn:disabled {
            background: #9e9e9e;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }
        .btn-tips-minimal {
            background: rgba(139, 195, 74, 0.2);
            color: rgba(255, 255, 255, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.3);
            padding: 4px 10px;
            font-size: 12px;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.3);
            pointer-events: auto;
        }
        .btn-tips-minimal.btn-pressed {
            background: #689F38;
            color: white;
            border-color: #689F38;
        }
        .options-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            margin-top: 8px;
            color: white;
            font-weight: bold;
        }
        .level-start-options {
            display: flex;
            gap: 8px;
        }
        #leaderboard-box {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 10px;
            padding: 8px;
            width: 100%;
            max-width: 280px;
            margin: 8px 0;
            font-size: 13px;
        }
        #leaderboard-box h3 {
            font-size: 14px;
            margin-bottom: 4px;
            color: #ffe082;
        }
        .lb-row {
            display: flex;
            justify-content: space-between;
            padding: 2px 5px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        .lb-row:last-child {
            border-bottom: none;
        }
        #name-input-container {
            display: flex;
            gap: 5px;
            margin: 5px 0;
        }
        #player-name-input {
            padding: 6px;
            border-radius: 8px;
            border: none;
            font-size: 14px;
            width: 150px;
            text-align: center;
        }
        #score-display {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 48px;
            font-weight: bold;
            color: white;
            text-shadow: 3px 3px 0 #000, -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000, 1px 1px 0 #000;
            z-index: 10;
        }
        #credit-popup {
            position: absolute;
            top: 75px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 16px;
            font-weight: bold;
            color: #ffe082;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.8);
            opacity: 0;
            transition: opacity 0.3s ease, transform 0.3s ease;
            z-index: 15;
            pointer-events: none;
        }
        #credit-popup.show {
            opacity: 1;
            transform: translateX(-50%) translateY(-5px);
        }
        #temp-message {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.85);
            color: white;
            padding: 15px 25px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            z-index: 40;
            opacity: 0;
            transition: opacity 0.3s ease;
            pointer-events: none;
            text-align: center;
            border: 2px solid #ff9800;
        }
        #temp-message.show {
            opacity: 1;
        }
        footer {
            margin-top: 8px;
            text-align: center;
            font-size: 11px;
            color: #ffffff;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.5);
        }
        footer a {
            color: #ffe082;
            text-decoration: none;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div id="game-container">
    <div id="score-display">0 🥚</div>
    <div id="credit-popup">+1 🥚</div>
    <div id="temp-message"></div>
    
    <canvas id="gameCanvas" width="360" height="640"></canvas>
    
    <!-- ÉCRAN DE DÉPART -->
    <div id="start-screen" class="overlay">
        <h1>FlapUp! <span id="start-title-emoji">🐣</span></h1>
        <div id="start-credit-display" class="credit-info">🪺 5</div>
        
        <div class="options-container">
            <div class="guide-control">
                <button id="guide-toggle-btn-start" class="btn-tips-minimal">💡Tips (1🥚)</button>
            </div>
            <div class="level-start-options">
                <button id="start-level-30-btn" class="btn-tips-minimal" style="display:none;"></button>
                <button id="start-level-50-btn" class="btn-tips-minimal" style="display:none;"></button>
            </div>
        </div>

        <p style="margin: 8px 0; font-size: 13px;">Touchez l'écran pour voler !</p>
        <button id="start-btn" class="btn">JOUER</button>
    </div>

    <!-- ÉCRAN DE GAME OVER -->
    <div id="game-over-screen" class="overlay" style="display: none;">
        <h1>🍗 GAME OVER</h1>
        <div class="score-line">
            Score : <span id="final-score-value">0</span> <span id="final-score-emoji"></span>
        </div>
        <div class="score-line">
            Record Local : <span id="best-score-value">0</span> <span id="best-score-emoji"></span>
        </div>
        
        <!-- Formulaire d'envoi de score en ligne -->
        <div id="name-input-container">
            <input type="text" id="player-name-input" placeholder="Votre pseudo" maxlength="12">
            <button id="submit-score-btn" class="btn-tips-minimal" style="background:#ff9800; color:white;">Envoyer</button>
        </div>

        <!-- Tableau des meilleurs scores mondiaux -->
        <div id="leaderboard-box">
            <h3>🏆 Top Mondial</h3>
            <div id="leaderboard-list">Chargement...</div>
        </div>

        <div id="gameover-credit-display" class="credit-info">🪺 5</div>

        <div class="options-container">
            <div class="guide-control">
                <button id="guide-toggle-btn-gameover" class="btn-tips-minimal">💡Tips (1🥚)</button>
            </div>
            <div class="level-start-options">
                <button id="gameover-level-30-btn" class="btn-tips-minimal" style="display:none;"></button>
                <button id="gameover-level-50-btn" class="btn-tips-minimal" style="display:none;"></button>
            </div>
        </div>

        <button id="restart-btn" class="btn">REJOUER</button>
    </div>
</div>

<footer>
    © 2026 FlapUp! - <a href="https://github.com/toroyoyo/FlapUp" target="_blank">GitHub</a>
</footer>

<script>
    // --- CONFIGURATION SUPABASE ---
    const SUPABASE_URL = 'VOTRE_URL_SUPABASE';
    const SUPABASE_ANON_KEY = 'VOTRE_CLE_ANON_SUPABASE';
    
    let supabaseClient = null;
    try {
        if (SUPABASE_URL !== 'VOTRE_URL_SUPABASE') {
            supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        }
    } catch(e) {
        console.warn("Supabase non configuré");
    }

    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    ctx.imageSmoothingEnabled = true;
    ctx.imageSmoothingQuality = 'high';

    const scoreDisplay = document.getElementById('score-display');
    const startScreen = document.getElementById('start-screen');
    const gameOverScreen = document.getElementById('game-over-screen');
    const finalScoreValueDisplay = document.getElementById('final-score-value');
    const finalScoreEmojiDisplay = document.getElementById('final-score-emoji');
    const bestScoreValueDisplay = document.getElementById('best-score-value');
    const bestScoreEmojiDisplay = document.getElementById('best-score-emoji');
    const startCreditDisplay = document.getElementById('start-credit-display');
    const gameOverCreditDisplay = document.getElementById('gameover-credit-display');
    const startBtn = document.getElementById('start-btn');
    const restartBtn = document.getElementById('restart-btn');
    const startTitleEmoji = document.getElementById('start-title-emoji');
    const creditPopup = document.getElementById('credit-popup');
    const playerNameInput = document.getElementById('player-name-input');
    const submitScoreBtn = document.getElementById('submit-score-btn');
    const leaderboardList = document.getElementById('leaderboard-list');

    const guideToggleBtnStart = document.getElementById('guide-toggle-btn-start');
    const guideToggleBtnGameover = document.getElementById('guide-toggle-btn-gameover');
    const startLevel30Btn = document.getElementById('start-level-30-btn');
    const startLevel50Btn = document.getElementById('start-level-50-btn');
    const gameoverLevel30Btn = document.getElementById('gameover-level-30-btn');
    const gameoverLevel50Btn = document.getElementById('gameover-level-50-btn');
    const tempMessage = document.getElementById('temp-message');
    const container = document.getElementById('game-container');

    let gameState = 'START';
    let score = 0;
    let bestScore = 0;
    let credits = 5;
    let lastCreditTime = Date.now();
    let showOptimalPathGuide = false;
    let guideRequestedForNextGame = false;
    let selectedStartLevel = 0;

    // --- GESTION AUTOMATIQUE DU PSEUDO DANS LE LOCALSTORAGE ---
    let playerName = localStorage.getItem('flapup_player_name') || '';
    if (playerName) {
        playerNameInput.value = playerName;
    }
    playerNameInput.addEventListener('input', () => {
        playerName = playerNameInput.value.trim();
        localStorage.setItem('flapup_player_name', playerName);
    });

    const MAX_CREDITS = 5;
    const REFILL_TIME_MS = 10 * 60 * 1000;
    const COST_NORMAL_GAME = 1;
    const COST_GUIDE_OPTION = 1;
    const COST_LEVEL_30 = 10;
    const COST_LEVEL_50 = 20;

    function getPlayerEmojiForScore(s) {
        if (s >= 120) return '🐉';
        else if (s >= 90) return '🐦‍🔥';
        else if (s >= 80) return '🦚';
        else if (s >= 70) return '🕊️';
        else if (s >= 60) return '🦃';
        else if (s >= 50) return '🐓';
        else if (s >= 40) return '🐦‍⬛';
        else if (s >= 30) return '🦜';
        else if (s >= 20) return '🐦';
        else if (s >= 10) return '🐥';
        else return '🐣'; 
    }

    try {
        bestScore = parseInt(localStorage.getItem('flapup_best')) || 0;
        const savedCredits = localStorage.getItem('flapup_credits');
        const savedTime = localStorage.getItem('flapup_last_time');
        const savedGuidePref = localStorage.getItem('flapup_guide_pref'); 
        const savedStartLevelPref = localStorage.getItem('flapup_start_level_pref');

        if (savedCredits !== null) credits = parseInt(savedCredits, 10);
        if (savedTime !== null) lastCreditTime = parseInt(savedTime, 10);
        if (savedGuidePref !== null) guideRequestedForNextGame = (savedGuidePref === 'true'); 
        if (savedStartLevelPref !== null) selectedStartLevel = parseInt(savedStartLevelPref, 10);
    } catch (e) {
        console.warn("LocalStorage non disponible :", e);
    }

    if (bestScore > 0) {
        startTitleEmoji.textContent = getPlayerEmojiForScore(bestScore);
    }

    function saveGameData() {
        try {
            localStorage.setItem('flapup_best', bestScore);
            localStorage.setItem('flapup_credits', credits);
            localStorage.setItem('flapup_last_time', lastCreditTime);
            localStorage.setItem('flapup_guide_pref', guideRequestedForNextGame); 
            localStorage.setItem('flapup_start_level_pref', selectedStartLevel);
            localStorage.setItem('flapup_player_name', playerNameInput.value.trim());
        } catch (e) {
            console.warn("Sauvegarde impossible :", e);
        }
    }

    function showTemporaryMessage(message, duration = 2500) {
        tempMessage.textContent = message;
        tempMessage.classList.add('show');
        setTimeout(() => { tempMessage.classList.remove('show'); }, duration);
    }

    function updateCreditsSystem() {
        const now = Date.now();
        if (credits < MAX_CREDITS) {
            let elapsed = now - lastCreditTime;
            if (elapsed >= REFILL_TIME_MS) {
                const addedCredits = Math.floor(elapsed / REFILL_TIME_MS);
                credits = Math.min(MAX_CREDITS, credits + addedCredits);
                lastCreditTime = lastCreditTime + (addedCredits * REFILL_TIME_MS);
                if (credits === MAX_CREDITS) lastCreditTime = now;
                saveGameData();
            }
        } else {
            lastCreditTime = now; 
        }
    }

    function getCreditDisplayString() {
        updateCreditsSystem();
        let elapsed = Date.now() - lastCreditTime;
        let remainingMinutes = Math.ceil((REFILL_TIME_MS - elapsed) / (60 * 1000));
        if (credits > 0) {
            return credits < MAX_CREDITS ? `🪺 ${credits} (+1 ds ${remainingMinutes}m)` : `🪺 ${credits}`;
        } else {
            return `🪹 0 (+1 ds ${remainingMinutes}m)`;
        }
    }

    function refreshUI() {
        const creditText = getCreditDisplayString();
        startCreditDisplay.textContent = creditText;
        gameOverCreditDisplay.textContent = creditText;

        let gameCost = COST_NORMAL_GAME + (guideRequestedForNextGame ? COST_GUIDE_OPTION : 0);
        if (selectedStartLevel === 30) gameCost += COST_LEVEL_30;
        else if (selectedStartLevel === 50) gameCost += COST_LEVEL_50;
        
        const canPlay = (credits >= gameCost);
        startBtn.disabled = !canPlay;
        restartBtn.disabled = !canPlay;
        startBtn.style.background = startBtn.disabled ? '#9e9e9e' : '#ff9800';
        restartBtn.style.background = restartBtn.disabled ? '#9e9e9e' : '#ff9800';

        const currentGuideBtn = (gameState === 'START') ? guideToggleBtnStart : guideToggleBtnGameover;
        currentGuideBtn.classList.toggle('btn-pressed', guideRequestedForNextGame);
        currentGuideBtn.disabled = (credits === 0);
        
        const lvl35Btn = (gameState === 'START') ? startLevel30Btn : gameoverLevel30Btn;
        const lvl50Btn = (gameState === 'START') ? startLevel50Btn : gameoverLevel50Btn;

        if (bestScore >= 30) {
            lvl35Btn.style.display = 'inline-block';
            lvl35Btn.textContent = `L30 ${getPlayerEmojiForScore(30)} (${COST_LEVEL_30}🥚)`;
            lvl35Btn.classList.toggle('btn-pressed', selectedStartLevel === 30);
        } else {
            lvl35Btn.style.display = 'none';
        }

        if (bestScore >= 50) {
            lvl50Btn.style.display = 'inline-block';
            lvl50Btn.textContent = `L50 ${getPlayerEmojiForScore(50)} (${COST_LEVEL_50}🥚)`;
            lvl50Btn.classList.toggle('btn-pressed', selectedStartLevel === 50);
        } else {
            lvl50Btn.style.display = 'none';
        }
    }

    // --- FONCTION CLASSEMENT SUPABASE ---
    async function fetchLeaderboard() {
        if (!supabaseClient) {
            leaderboardList.innerHTML = '<div style="font-size:11px; color:#ccc;">Non configuré</div>';
            return;
        }
        try {
            const { data, error } = await supabaseClient
                .from('leaderboard')
                .select('name, score, emoji')
                .order('score', { ascending: false })
                .limit(5);

            if (error) throw error;

            if (!data || data.length === 0) {
                leaderboardList.innerHTML = '<div style="font-size:12px;">Aucun score enregistré</div>';
                return;
            }

            let html = '';
            data.forEach((row, index) => {
                let medal = index === 0 ? '🥇' : index === 1 ? '🥈' : index === 2 ? '🥉' : '▫️';
                html += `<div class="lb-row"><span>${medal} ${row.name || 'Anonyme'}</span><span><b>${row.score}</b> ${row.emoji || ''}</span></div>`;
            });
            leaderboardList.innerHTML = html;
        } catch (err) {
            leaderboardList.innerHTML = '<div style="font-size:11px; color:#ffcc00;">Erreur de chargement</div>';
        }
    }

    submitScoreBtn.addEventListener('click', async () => {
        let name = playerNameInput.value.trim();
        if (!name) {
            showTemporaryMessage("Entrez un pseudo !");
            return;
        }
        playerName = name;
        saveGameData();

        if (!supabaseClient) {
            showTemporaryMessage("Supabase non relié !");
            return;
        }

        submitScoreBtn.disabled = true;
        submitScoreBtn.textContent = "...";

        try {
            const { error } = await supabaseClient
                .from('leaderboard')
                .insert([{ name: playerName, score: score, emoji: getPlayerEmojiForScore(score) }]);

            if (error) throw error;
            showTemporaryMessage("Score envoyé au classement !");
            fetchLeaderboard();
        } catch (err) {
            showTemporaryMessage("Erreur lors de l'envoi");
        } finally {
            submitScoreBtn.disabled = false;
            submitScoreBtn.textContent = "Envoyer";
        }
    });

    // Contrôles UI
    guideToggleBtnStart.addEventListener('click', (e) => { e.stopPropagation(); guideRequestedForNextGame = !guideRequestedForNextGame; saveGameData(); refreshUI(); });
    guideToggleBtnGameover.addEventListener('click', (e) => { e.stopPropagation(); guideRequestedForNextGame = !guideRequestedForNextGame; saveGameData(); refreshUI(); });
    startLevel30Btn.addEventListener('click', (e) => { e.stopPropagation(); selectedStartLevel = selectedStartLevel === 30 ? 0 : 30; saveGameData(); refreshUI(); });
    startLevel50Btn.addEventListener('click', (e) => { e.stopPropagation(); selectedStartLevel = selectedStartLevel === 50 ? 0 : 50; saveGameData(); refreshUI(); });
    gameoverLevel30Btn.addEventListener('click', (e) => { e.stopPropagation(); selectedStartLevel = selectedStartLevel === 30 ? 0 : 30; saveGameData(); refreshUI(); });
    gameoverLevel50Btn.addEventListener('click', (e) => { e.stopPropagation(); selectedStartLevel = selectedStartLevel === 50 ? 0 : 50; saveGameData(); refreshUI(); });

    let firstJumpOccurred = false; 
    const bird = { x: 60, y: 280, radius: 15, gravity: 0.28, jump: -6.4, velocity: 0, emoji: '🥚' };
    let pipes = [];
    const pipeWidth = 50;
    const pipeGap = 165;
    const pipeSpeed = 2.0;
    let frameCount = 0;
    let clouds = [
        { x: 50, y: 100, speed: 0.5, size: 30, opacity: 0.4 },
        { x: 220, y: 180, speed: 0.3, size: 24, opacity: 0.3 }
    ];

    function getObstacleEmojiForScore(s) {
        if (s >= 100) return '🔥';
        else if (s >= 80) return '⛓️';
        else if (s >= 70) return '🚧';
        else if (s >= 50) return '🛢️';
        else if (s >= 30) return '🪨';
        else if (s >= 10) return '🌵';
        else return '🪵';
    }

    function shouldMirrorPlayerEmoji(emoji) {
        return ['🐦', '🦜', '🐓', '🦃', '🕊️', '🐉', '🦚'].includes(emoji);
    }

    function updateBirdEmoji() {
        if (score > 0 && score % 10 === 0) { 
            credits++; 
            saveGameData();
            creditPopup.classList.add('show');
            setTimeout(() => creditPopup.classList.remove('show'), 1500);
        }
        bird.emoji = (score === 0 && !firstJumpOccurred) ? '🥚' : getPlayerEmojiForScore(score);
        scoreDisplay.textContent = score + ' ' + bird.emoji;
    }

    function resetGame() {
        bird.y = 280;
        bird.velocity = 0;
        pipes = [];
        score = 0;
        firstJumpOccurred = false;
        bird.emoji = '🥚';
        scoreDisplay.textContent = score + ' ' + bird.emoji;
        frameCount = 0;
    }

    function jump() {
        if (gameState === 'PLAYING') {
            if (!firstJumpOccurred) { firstJumpOccurred = true; updateBirdEmoji(); }
            bird.velocity = bird.jump;
        }
    }

    container.addEventListener('touchstart', (e) => { if (gameState === 'PLAYING') { if (e.cancelable) e.preventDefault(); jump(); } }, { passive: false });
    container.addEventListener('mousedown', () => { if (gameState === 'PLAYING') jump(); });
    window.addEventListener('keydown', (e) => { if (e.code === 'Space') { e.preventDefault(); if (gameState === 'PLAYING') jump(); } });

    function startGame(e) {
        if (e) { e.stopPropagation(); e.preventDefault(); }
        updateCreditsSystem(); 

        let gameCost = COST_NORMAL_GAME + (guideRequestedForNextGame ? COST_GUIDE_OPTION : 0);
        if (selectedStartLevel === 30) gameCost += COST_LEVEL_30;
        if (selectedStartLevel === 50) gameCost += COST_LEVEL_50;

        if (credits < gameCost) {
            showTemporaryMessage(`Crédits insuffisants ! (${gameCost} 🥚 requis)`);
            refreshUI(); 
            return;
        }

        credits -= gameCost;
        saveGameData();
        showOptimalPathGuide = guideRequestedForNextGame; 
        resetGame(); 

        if (selectedStartLevel > 0) {
            score = selectedStartLevel;
            bird.emoji = getPlayerEmojiForScore(selectedStartLevel);
            scoreDisplay.textContent = score + ' ' + bird.emoji;
            firstJumpOccurred = true;
        }

        gameState = 'PLAYING';
        startScreen.style.display = 'none';
        gameOverScreen.style.display = 'none';
    }

    startBtn.addEventListener('click', startGame);
    restartBtn.addEventListener('click', startGame);

    function spawnPipe() {
        let topHeight = Math.floor(Math.random() * (canvas.height - pipeGap - 110)) + 50;
        pipes.push({ x: canvas.width, top: topHeight, bottom: canvas.height - topHeight - pipeGap, passed: false });
    }

    function update() {
        updateCreditsSystem();
        clouds.forEach(c => { c.x -= c.speed; if (c.x < -50) c.x = canvas.width + 50; });
        if (gameState !== 'PLAYING') return;

        frameCount++;
        bird.velocity += bird.gravity;
        bird.y += bird.velocity;

        if (bird.y + bird.radius >= canvas.height - 40 || bird.y - bird.radius <= 0) triggerGameOver();
        if (frameCount % 105 === 0) spawnPipe();

        for (let i = pipes.length - 1; i >= 0; i--) {
            let p = pipes[i];
            p.x -= pipeSpeed;
            if (bird.x + bird.radius > p.x && bird.x - bird.radius < p.x + pipeWidth) {
                if (bird.y - bird.radius < p.top || bird.y + bird.radius > canvas.height - p.bottom) triggerGameOver();
            }
            if (!p.passed && p.x + pipeWidth < bird.x) { p.passed = true; score++; updateBirdEmoji(); }
            if (p.x + pipeWidth < 0) pipes.splice(i, 1);
        }
    }

    function drawPipeSection(x, startY, height, emoji) {
        ctx.font = '32px "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        let count = Math.ceil(height / 35);
        ctx.save();
        ctx.beginPath();
        ctx.rect(x, startY, pipeWidth, height);
        ctx.clip();
        for (let i = 0; i < count; i++) {
            ctx.fillText(emoji, x + pipeWidth / 2, startY + (i * 35) + 18);
        }
        ctx.restore();
    }

    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        clouds.forEach(c => { 
            ctx.globalAlpha = c.opacity; 
            ctx.font = `${c.size}px "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif`; 
            ctx.fillText('☁️', c.x, c.y); 
        });
        
        let obsEmoji = getObstacleEmojiForScore(score);
        pipes.forEach(p => {
            drawPipeSection(p.x, 0, p.top, obsEmoji);
            drawPipeSection(p.x, canvas.height - p.bottom, p.bottom, obsEmoji);
        });

        ctx.fillStyle = '#c4bc75'; ctx.fillRect(0, canvas.height - 40, canvas.width, 40);
        ctx.fillStyle = '#8ab23f'; ctx.fillRect(0, canvas.height - 40, canvas.width, 6);

        ctx.save();
        ctx.translate(bird.x, bird.y);
        ctx.rotate(Math.min(Math.max(bird.velocity * 0.04, -0.4), 0.6));
        if (shouldMirrorPlayerEmoji(bird.emoji)) { ctx.scale(-1, 1); ctx.translate(-36, 0); }
        ctx.font = '36px "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif'; 
        ctx.textAlign = 'center'; 
        ctx.textBaseline = 'middle';
        ctx.fillText(bird.emoji, 0, 0);
        ctx.restore();
    }

    function triggerGameOver() {
        gameState = 'GAMEOVER';
        if (score > bestScore) {
            bestScore = score;
            startTitleEmoji.textContent = getPlayerEmojiForScore(bestScore);
        }
        saveGameData();

        finalScoreValueDisplay.textContent = score;
        finalScoreEmojiDisplay.textContent = getPlayerEmojiForScore(score);
        bestScoreValueDisplay.textContent = bestScore;
        bestScoreEmojiDisplay.textContent = getPlayerEmojiForScore(bestScore);
        
        refreshUI();
        gameOverScreen.style.display = 'flex';
        fetchLeaderboard();
    }

    function loop() {
        update();
        draw();
        requestAnimationFrame(loop);
    }

    refreshUI();
    loop();
</script>
</body>
</html>
